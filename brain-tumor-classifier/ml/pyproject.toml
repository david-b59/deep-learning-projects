[project]
name = "brain-mri"
version = "0.1.0"
description = "Classification d'IRM cérébrales avec PyTorch (transfer learning) et Grad-CAM"
requires-python = ">=3.12"
dependencies = [
    "captum>=0.9.0",
    "kaggle>=2.2.5",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "six>=1.17.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "truststore>=0.10.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_mri"]

# Style du code : longueur de ligne maximale
[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

# Règles de lint : erreurs (E, F), imports (I), syntaxe moderne (UP), bugs probables (B),
# docstrings (D)
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

# Les docstrings suivent le format Google (sections Args, Returns, Raises)
[tool.ruff.lint.pydocstyle]
convention = "google"

# Les tests ont déjà une docstring courte : on n'impose pas le format complet
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
