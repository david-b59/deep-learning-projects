[project]
name = "brain-mri"
version = "0.1.0"
description = "Brain tumor MRI classification with PyTorch transfer learning and Grad-CAM"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_mri"]

[tool.ruff]
line-length = 100
