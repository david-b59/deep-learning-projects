# Pipeline configuration. Relative paths are relative to brain-tumor-classifier/.
# Validated by brain_mri.config (unknown keys are rejected).

data:
  raw_dir: data/raw                 # downloaded dataset (Training/ and Testing/)
  processed_dir: data/processed     # generated reports (git-ignored)
  image_size: 224                   # ResNet-50 input size
  batch_size: 32
  val_fraction: 0.15                # share of Training kept for validation
  seed: 42                          # makes the split and shuffling reproducible
  num_workers: 0                    # DataLoader worker processes (0 = main process)
  flip_prob: 0.5                    # light augmentation, training set only
  rotation_degrees: 10
  jitter: 0.1                       # brightness and contrast
  mean: [0.485, 0.456, 0.406]       # ImageNet statistics, required by the pretrained model
  std: [0.229, 0.224, 0.225]
