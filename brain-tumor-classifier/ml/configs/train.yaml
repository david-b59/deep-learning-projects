# Configuration du pipeline. Les chemins relatifs partent de brain-tumor-classifier/.
# Validée par brain_mri.config (les clés inconnues sont refusées).

data:
  raw_dir: data/raw                 # jeu de données téléchargé (Training/ et Testing/)
  processed_dir: data/processed     # rapports générés (hors git)
  image_size: 224                   # taille d'entrée du ResNet-50
  batch_size: 32                    # nombre d'images par lot
  val_fraction: 0.15                # part de Training gardée pour la validation
  seed: 42                          # rend le découpage et le mélange reproductibles
  num_workers: 0                    # processus de chargement des données (0 = processus principal)
  flip_prob: 0.5                    # augmentation légère, entraînement uniquement
  rotation_degrees: 10              # rotation aléatoire de ± 10 degrés
  jitter: 0.1                       # variation de luminosité et de contraste
  mean: [0.485, 0.456, 0.406]       # statistiques d'ImageNet, exigées par le modèle pré-entraîné
  std: [0.229, 0.224, 0.225]

model:
  pretrained: true                  # ResNet-50 avec les poids ImageNet
  freeze_backbone: true             # phase 1 : seule la nouvelle tête de classification est entraînée
