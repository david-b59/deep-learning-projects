[project]
name = "brain-mri-api"
version = "0.1.0"
description = "API FastAPI qui sert le classifieur d'IRM cérébrales (prédiction + Grad-CAM)"
requires-python = ">=3.12"
dependencies = [
    "brain-mri",
    "fastapi>=0.162.0",
    "huggingface-hub>=2.4.0",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Style du code : mêmes règles que le projet ml/
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
brain-mri = { path = "../ml" }
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "safetensors>=0.8.0",
    "torch>=2.15.0",
]

# PyTorch CPU sous Linux (Docker) : sans cela, uv installe les roues CUDA (plusieurs Go).
# Sous Windows et macOS, on garde PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
